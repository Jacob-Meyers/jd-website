<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JD PictureFlip</title>
    <link rel="stylesheet" href="pg.css">
    <link rel="icon" type="image/x-icon" href="/res/pictureflip/pf.png">
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="titlebar">
<h1>JD PictureFlip</h1>
<h4>Software - <a href="/" style="color: rgb(255, 255, 255);">Created By Jeyers Development</a></h4>
<h2><a href="https://discord.gg/SbEvTFHW3a" target="_blank" style="color: magenta;">JOIN THE DISCORD</a></h2>
</div>


<div class="center" style="padding: 40px;">
  <p>A free photo deleter, shows a photo. Shows an image, you can keep or delete each image.
      Built on Java 21, free for all use.</p>
</div>

<div class="iframely-embed"><div class="iframely-responsive" style="height: 140px; padding-bottom: 0;"><a href="https://ko-fi.com/s/b422368768" data-iframely-url="https://iframely.net/fwX1Kqrn?card=small&theme=dark"></a></div></div><script async src="https://iframely.net/embed.js"></script>

<footer>
<div class="center">
    <p style="font-size: 12px;">Made By Jeyers Development</p>
    <p style="font-size: 12px;">CONTACT: <a href="jeyersdev@gmail.com" style="color: lime;">jeyersdev@gmail.com</a></p>
</div>
</footer>

<script>
  fetch('/navbar.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('navbar-placeholder').innerHTML = data;

      const dropdownBtn = document.querySelector(".dropdown-btn");
      const dropdownMenu = document.querySelector(".dropdown-menu");

      if (dropdownBtn && dropdownMenu) {
        dropdownBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          dropdownMenu.classList.toggle("show");
        });

        document.addEventListener("click", () => {
          dropdownMenu.classList.remove("show");
        });
      }
    })
    .catch(err => console.error("Error loading the navbar: ", err));
</script>



</body>
</html>
